version: '3.8'
services:
mapos:
build:
context: .
dockerfile: Dockerfile
container_name: mapos-app
restart: always
environment:
- DB_HOSTNAME=mapos_db
- DB_USERNAME=mapos
- DB_PASSWORD=mapos_pass
- DB_DATABASE=mapos_db
- BASE_URL=https://${COOLIFY_FQDN}
volumes:
- mapos_data:/var/www/html
networks:
- mapos-network
depends_on:
- db
# Serviço do Banco de Dados
mapos_db:
image: mysql:5.7
container_name: mapos-db
restart: always
environment:
- MYSQL_ROOT_PASSWORD=root_pass
- MYSQL_DATABASE=mapos_db
- MYSQL_USER=mapos
- MYSQL_PASSWORD=mapos_pass
volumes:
- mysql_data:/var/lib/mysql

networks:
- mapos-network
networks:
mapos-network:
driver: bridge
volumes:
mapos_data:
mysql_data:
